# Continuous integration: type-check, lint and build every pull request
# (and every push to main) so a type/lint error can't be merged just
# because Render's own build happened to pass. Deploys are NOT done here —
# Render auto-deploys from main (see render.yaml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks out code and runs scripts.
permissions:
  contents: read

# A newer push to the same PR/branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next.js generates global route types (LayoutProps, PageProps, ...)
      # into .next/types. They exist locally after `next dev`, but not on a
      # fresh CI checkout, so generate them first or tsc fails on
      # `Cannot find name 'LayoutProps'`.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Unit tests (#339) run once per time zone: much of the logic is local
  # calendar-day math, and bugs like #279 (a date-only value read as UTC
  # midnight) only show west of UTC. A separate job, so typecheck, lint and
  # build don't run four times. Coverage is reported, not enforced.
  test:
    name: Test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Berlin, America/Los_Angeles, Asia/Kolkata, Pacific/Auckland]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        if: matrix.tz != 'Europe/Berlin'
        run: npm test

      - name: Test with coverage
        if: matrix.tz == 'Europe/Berlin'
        run: npm run test:coverage
